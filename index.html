<style>
/* Layout: jogo em tela cheia. Canvas ocupa tudo; HUD fino por cima (vida, XP, tempo); modais centrais. Visual de tecido vivo: vermelho-sangue escuro, bactéria verde-ácido, células do sistema imune claras. Tema escuro único. */
:root{
  --bg:#14030a; --panel:#220a14; --panel2:#2f0f1d; --line:#4a1a2c;
  --fg:#fff0f3; --mut:#c493a3; --hp:#ff4f7b; --xp:#30e0c0; --acc:#ffd84a; --vio:#ff9ad1;
  --disp:'Rubik Mono One','Arial Black',sans-serif; --body:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--body);margin:0;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;width:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:10px 14px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bar{height:9px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .15s}
#hpb i{background:var(--hp)} #xpb i{background:var(--xp)}
.row{display:flex;align-items:center;gap:10px;font:500 13px var(--body);font-variant-numeric:tabular-nums}
.row b{font:400 18px var(--disp);letter-spacing:.02em}
#time{margin:0 auto}
#pause,#snd{pointer-events:auto;background:rgba(20,12,34,.8);border:1px solid var(--line);color:var(--fg);width:38px;height:38px;border-radius:10px;font:700 14px var(--body);cursor:pointer}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font:400 20px/1.2 var(--disp);color:var(--hp);text-shadow:0 0 18px rgba(255,79,123,.6);pointer-events:none;opacity:0;transition:opacity .3s;padding-inline:16px}
.ov{position:absolute;inset:0;background:rgba(14,2,7,.86);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;overflow:auto}
.ov[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:440px;width:100%;margin:auto}
.card h2{margin:0 0 6px;font:400 24px/1.1 var(--disp);letter-spacing:.01em;text-wrap:balance}
.card h3{margin:12px 0 4px;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--vio)}
.card p{margin:4px 0}
.c{color:var(--mut)}
.main{margin-top:14px;width:100%;min-height:52px;background:var(--xp);color:#122800;border:0;border-radius:14px;font:400 17px var(--disp);cursor:pointer}
.sec{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:8px;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);cursor:pointer;font:400 13px var(--body)}
.pick img{width:44px;height:44px;flex:0 0 auto}
.pick b{display:block;font:700 16px var(--body)}
.pick em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.pick span{color:var(--mut)}
.grid5{display:grid;grid-template-columns:repeat(var(--gc,5),1fr);gap:6px;max-width:300px;margin:10px auto 0}
.slot{aspect-ratio:1;border-radius:10px;background:var(--bg);border:1px dashed transparent;display:flex;align-items:center;justify-content:center;position:relative;padding:0;cursor:default}
.slot img{width:80%;height:80%}
.slot.core{background:radial-gradient(circle,#eaffd0 0,#8fe060 40%,#1f4d1a 78%)}
.slot.free{border-color:var(--xp);background:rgba(48,224,192,.08);cursor:pointer}
.slot.free:hover{background:rgba(48,224,192,.2)}
.slot.boost{box-shadow:0 0 0 2px var(--acc) inset}
.slot .arr{position:absolute;font-size:12px;color:#5ff2ff}
.meta{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.meta div{flex:1;min-width:0}
.meta b{display:block;font-weight:700}
.meta span{font-size:12px;color:var(--mut)}
.meta button{background:var(--acc);color:#2a2100;border:0;border-radius:10px;min-width:70px;min-height:40px;font:700 14px var(--body);cursor:pointer}
.meta button:disabled{background:var(--line);color:var(--mut);cursor:default}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stats div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.stats small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.stats b{font:400 18px var(--disp)}
button:focus-visible{outline:2px solid var(--xp);outline-offset:2px}
#spc[hidden]{display:none}
#spc{--k:0;position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;color:var(--fg);font:700 11px/1.15 var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center;
  background:radial-gradient(circle,var(--panel) 0 58%,transparent 59%),conic-gradient(var(--acc) calc(var(--k)*360deg),rgba(255,255,255,.12) 0);opacity:.85;touch-action:none}
#spc small{font-weight:400;font-size:9px;color:var(--mut)}
#spc.ready{opacity:1;animation:rdy 1s ease-in-out infinite;box-shadow:0 0 22px rgba(255,216,74,.6)}
#spc.nope,.spcx.nope{animation:nope .3s}
.spcx{right:16px!important}#spc1{bottom:calc(116px + env(safe-area-inset-bottom,0px))!important}#spc2{bottom:calc(212px + env(safe-area-inset-bottom,0px))!important}
@media (hover:hover) and (pointer:fine){#spc1{bottom:calc(126px + env(safe-area-inset-bottom,0px))!important}#spc2{bottom:calc(232px + env(safe-area-inset-bottom,0px))!important}}
@keyframes rdy{50%{transform:scale(1.06)}}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (hover:hover) and (pointer:fine){#spc{width:96px;height:96px}}
@media (hover:none){#spc small{display:none}}
#fury{position:absolute;left:50%;top:92px;transform:translateX(-50%);font:400 13px var(--disp);color:#ff9a2a;letter-spacing:.1em;pointer-events:none;text-shadow:0 0 10px rgba(255,154,42,.7)}
.slot.void{background:transparent;opacity:.15;border:1px dashed var(--line)}
.pick.spc img{width:72px;height:72px;border-radius:12px}
#obj{position:absolute;left:50%;top:96px;transform:translateX(-50%);font:600 12px var(--body);color:#ffb03a;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
#obj[hidden]{display:none}
.front{text-align:center;margin:8px 0 -4px;font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.06em}
#hud{max-width:820px;margin:0 auto}
.card.wide{max-width:560px}
.placehead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.placehead img{width:58px;height:58px;filter:drop-shadow(0 0 10px rgba(255,216,74,.5))}
.placehead em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.placehead h2{margin:0}
.slot img.ghost{opacity:0;transition:opacity .12s}
.slot.free.hov img.ghost,.slot.free:hover img.ghost,.slot.free:focus-visible img.ghost{opacity:.6}
.slot.core1{background:radial-gradient(circle,#c9b6d6 0,#6a5a6e 45%,#2a1f2e 80%)}
.slot.core3{background:radial-gradient(circle,#ffd27a 0,#b07a22 45%,#2a1a06 80%)}
.slot.core4{background:radial-gradient(circle,#c9ffb0 0,#3a5a4a 45%,#05070f 80%)}
.slot.core2{background:radial-gradient(circle,#c6ff8a 0,#4f5a3a 45%,#1d1f14 80%)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 2px}
.tag img{width:22px;height:22px}
.acts{display:grid;gap:8px}
.act{text-align:left;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);cursor:pointer;font:400 13px var(--body)}
.act b{display:block;font:400 15px var(--disp);color:var(--xp);margin-bottom:2px}
.act span{color:var(--mut)}
.act:hover:not(:disabled){border-color:var(--xp)}
.act.lock{opacity:.45;cursor:default}
.act.lock b{color:var(--mut)}
.confirm{margin-top:14px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--hp)}
.confirm p{margin:0}
.crow{display:flex;gap:8px}.crow .main{margin-top:10px}
.main.danger{background:var(--hp);color:#2a0010}
.desk{display:none}
@media (hover:hover) and (pointer:fine){.desk{display:inline}.touch{display:none}}
.card.storycard{background:#050203;border-color:#1a0a10;text-align:center;padding:32px 22px}
.story p{opacity:0;animation:fin .9s ease forwards}
.story .l1{font:400 20px/1.3 var(--disp);color:var(--fg);animation-delay:.2s}
.story .l2{font:400 20px/1.3 var(--disp);color:var(--hp);animation-delay:1.4s}
.story .l3{margin-top:26px;font:400 15px var(--disp);color:var(--xp);letter-spacing:.06em;animation-delay:2.8s}
.story .l4{color:var(--mut);animation-delay:3.4s}
.story .l5{opacity:0;animation:fin .6s ease 3.9s forwards}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.story p,.story .l5{animation:none;opacity:1}}
@media (min-width:900px){
  #hud{padding-top:16px}
  .row{font-size:15px}.row b{font-size:22px}
  .bar{height:11px}
  .grid5{max-width:360px}
  #banner{font-size:28px}
  .card{max-width:500px}
}
body[data-act="1"]{--bg:#0c0d11;--panel:#16181e;--panel2:#1f2229;--line:#2e323b}
body[data-act="3"]{--bg:#060403;--panel:#16100a;--panel2:#21180e;--line:#3a2a14}

/* ===== tema sinistro / abominação ===== */
:root{--bg:#0c0205;--panel:#1a0509;--panel2:#25080e;--line:#4a0f1c;--fg:#f6e6e0;--mut:#b88a8f;--hp:#ff2e4a;--xp:#30e0c0;--acc:#ffcf4a;--vio:#ff6a6a;--bone:#e8dcc0}
.ov{background:radial-gradient(ellipse at 50% 40%,rgba(40,0,6,.82),rgba(4,0,1,.94))}
.card{box-shadow:0 0 0 1px rgba(255,46,74,.08),0 20px 60px rgba(0,0,0,.6),inset 0 0 40px rgba(90,0,12,.25)}
.title{font:400 30px/1.05 var(--disp)!important;color:var(--fg);text-shadow:0 2px 0 #4a0010,0 0 22px rgba(255,30,60,.45);letter-spacing:.02em}
.menurow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menurow .main{font-size:13px;min-height:56px;padding:0 8px}
.won{font-style:normal;color:var(--xp);margin-left:4px}
.act .rec{display:block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acc)}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tcol{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.tcol h3{text-align:center;margin:0 0 6px}
.tline{display:block;width:2px;height:10px;margin:0 auto;background:linear-gradient(var(--line),var(--hp))}
.tnode{text-align:left;padding:8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);cursor:pointer;font:400 11px/1.3 var(--body);display:flex;flex-direction:column;gap:2px;min-width:0}
.tnode b{font:700 12px var(--body)}
.tnode span{color:var(--mut)}
.tnode .pips{color:var(--hp);letter-spacing:2px;font-size:10px}
.tnode em{font-style:normal;font-weight:700;color:var(--acc);font-size:11px}
.tnode:not(:disabled):hover{border-color:var(--hp);box-shadow:0 0 14px rgba(255,46,74,.35)}
.tnode:disabled{cursor:default}
.tnode.max{border-color:#7a1424;background:linear-gradient(#3a0a14,#25080e)}
.tnode.max em{color:var(--xp)}
.tnode.locked{opacity:.4}
.tnode.locked em{color:var(--mut);font-weight:400}
@media (max-width:520px){.tree{grid-template-columns:1fr}.tline{height:6px}}
.chal{display:flex;gap:10px;align-items:center;margin-top:6px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.chal i{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;color:#122800;font-weight:700;font-size:12px}
.chal div{flex:1;min-width:0}.chal b{display:block}.chal span{color:var(--mut);font-size:12px}
.chal em{font-style:normal;font-weight:700;color:var(--acc);white-space:nowrap}
.chal.done{border-color:#3d5a1a}.chal.done i{background:var(--xp);border-color:var(--xp)}.chal.done em{color:var(--mut);text-decoration:line-through}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mode{padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);cursor:pointer;font:400 14px var(--disp);text-align:left}
.mode span{display:block;font:400 11px/1.3 var(--body);color:var(--mut);margin-top:3px}
.mode.on{border-color:var(--hp);box-shadow:0 0 0 1px var(--hp) inset,0 0 18px rgba(255,46,74,.3)}
.mode:disabled{opacity:.45;cursor:default}
.pick{transition:transform .12s,box-shadow .12s}
.pick:hover{transform:translateY(-2px)}
.pick.rar1{border-color:#3a8cff;box-shadow:inset 0 0 18px rgba(58,140,255,.18)}.pick.rar1 em{color:#7ab4ff}
.pick.rar2{border-color:#b04aff;box-shadow:inset 0 0 22px rgba(176,74,255,.25)}.pick.rar2 em{color:#d39aff}

.pick.evo{background:linear-gradient(120deg,#3a0610,#1a0509 60%);animation:evoG 1.4s ease-in-out infinite}
@keyframes evoG{50%{box-shadow:inset 0 0 30px rgba(255,58,42,.45),0 0 26px rgba(255,58,42,.55)}}
.sico{flex:0 0 44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle,#4a0c18,#1a0509);color:var(--bone);border:1px solid var(--line)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.statgrid div{background:var(--panel2);border-radius:10px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.statgrid small{color:var(--mut);font-size:11px}.statgrid b{font:700 13px var(--body)}
.tag.evo{border-color:var(--hp);color:#ff8a8a;box-shadow:0 0 10px rgba(255,46,74,.4)}
.chdone{margin-top:10px;padding:10px;border-radius:12px;border:1px solid #3d5a1a;background:rgba(200,255,74,.07);color:var(--xp);font-size:13px}
#combo{--k:1;position:absolute;right:14px;top:96px;pointer-events:none;text-align:right;font:600 11px var(--body);color:var(--mut);letter-spacing:.06em}
#combo[hidden]{display:none}
#combo b{display:block;font:400 30px/1 var(--disp);color:var(--hp);text-shadow:0 0 14px rgba(255,46,74,.7),0 2px 0 #3a0008}
#combo::after{content:'';display:block;height:3px;margin-top:4px;margin-left:auto;width:calc(var(--k)*110px);background:var(--hp);border-radius:2px}
#hpb{box-shadow:0 0 0 1px rgba(255,46,74,.25)}
#hpb i{background:linear-gradient(90deg,#7a0012,var(--hp))}
#xpb i{background:linear-gradient(90deg,#4a7a00,var(--xp))}

.tlab{position:absolute;transform:translate(-50%,-50%);font:400 13px var(--disp);font-style:normal;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 10px currentColor;pointer-events:none}

.spcx[hidden]{display:none}
.spcx{--k:0;position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;color:var(--fg);font:700 11px/1.15 var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center;
  background:radial-gradient(circle,var(--panel) 0 58%,transparent 59%),conic-gradient(var(--acc) calc(var(--k)*360deg),rgba(255,255,255,.12) 0);opacity:.85;touch-action:none}
.spcx small{font-weight:400;font-size:9px;color:var(--mut)}
.spcx.ready{opacity:1;animation:rdy 1s ease-in-out infinite;box-shadow:0 0 22px rgba(255,216,74,.6)}
.spcx.nope,.spcx.nope{animation:nope .3s}
</style>
<div id="app">
  <canvas id="cv" aria-label="Arena"></canvas>
  <div id="hud">
    <div class="bar" id="hpb"><i></i></div>
    <div class="bar" id="xpb"><i></i></div>
    <div class="row"><span>Nv <b id="lvl">1</b></span><span id="time"><b>0:00</b></span><span>☠ <b id="kills">0</b></span><button id="snd" aria-label="Som">🔊</button><button id="pause" aria-label="Pausar">II</button></div>
  </div>
  <div id="banner"></div>
  <div id="fury" hidden>FÚRIA</div>
  <div id="obj" hidden></div>
  <div id="combo" hidden></div>
  <button id="spc" aria-label="Habilidade especial" hidden><span id="spcn">Especial</span><small>Espaço / E</small></button>
  <div class="ov" id="ov" hidden></div>
</div>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="telemetry.js"></script>



</body></html>
